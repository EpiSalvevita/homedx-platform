name: iOS

# Separate workflow: the macOS job is slow (~25 min), so it only runs when the
# mobile app or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/ios.yml'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create CI .env for Flutter
        working-directory: frontend/mobile/hdx_mobile
        run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend/mobile/hdx_mobile
        run: flutter pub get

      # Generates Generated.xcconfig and plugin registrants without compiling;
      # xcodebuild test below does the one real build (without the proprietary Cube SDK).
      - name: Flutter iOS config only
        working-directory: frontend/mobile/hdx_mobile
        run: flutter build ios --config-only --simulator --debug

      - name: Pod install
        working-directory: frontend/mobile/hdx_mobile/ios
        run: pod install

      - name: Select simulator
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS-(1[7-9]|[2-9][0-9])")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          test -n "$UDID" && [ "$UDID" != "null" ]
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run RunnerTests
        working-directory: frontend/mobile/hdx_mobile
        run: |
          xcodebuild test -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/RunnerTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # Test evidence (IEC 62304): the job fails unless the result bundle
      # shows at least MIN_TESTS executed tests and no failures. CI never has
      # the proprietary Cube SDK, so the bundle contains no vendor material.
      - name: Summarise test results
        if: always()
        env:
          MIN_TESTS: '20'
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/RunnerTests.xcresult"
          SUMMARY="$RUNNER_TEMP/RunnerTests-summary.json"
          test -d "$BUNDLE" || { echo "::error::No result bundle at $BUNDLE"; exit 1; }
          xcrun xcresulttool get test-results summary --path "$BUNDLE" > "$SUMMARY"
          jq . "$SUMMARY"
          TOTAL=$(jq -r '.totalTestCount // 0' "$SUMMARY")
          PASSED=$(jq -r '.passedTests // 0' "$SUMMARY")
          FAILED=$(jq -r '.failedTests // 0' "$SUMMARY")
          SKIPPED=$(jq -r '.skippedTests // 0' "$SUMMARY")
          RESULT=$(jq -r '.result // "unknown"' "$SUMMARY")
          echo "RunnerTests: result=$RESULT total=$TOTAL passed=$PASSED failed=$FAILED skipped=$SKIPPED"
          {
            echo "### RunnerTests"
            echo "| result | total | passed | failed | skipped |"
            echo "|---|---|---|---|---|"
            echo "| $RESULT | $TOTAL | $PASSED | $FAILED | $SKIPPED |"
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh "$BUNDLE"
          (cd "$RUNNER_TEMP" && zip -qr RunnerTests.xcresult.zip RunnerTests.xcresult)
          if [ "$TOTAL" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $TOTAL tests ran (minimum $MIN_TESTS)"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runnertests-evidence
          path: |
            ${{ runner.temp }}/RunnerTests-summary.json
            ${{ runner.temp }}/RunnerTests.xcresult.zip
          if-no-files-found: warn
          retention-days: 90
