name: iOS

# Separate workflow: the macOS job is slow (~25 min), so it only runs when the
# mobile app or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/ios.yml'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create CI .env for Flutter
        working-directory: frontend/mobile/hdx_mobile
        run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend/mobile/hdx_mobile
        run: flutter pub get

      # Generates Generated.xcconfig and plugin registrants without compiling;
      # xcodebuild test below does the one real build (without the proprietary Cube SDK).
      - name: Flutter iOS config only
        working-directory: frontend/mobile/hdx_mobile
        run: flutter build ios --config-only --simulator --debug

      - name: Pod install
        working-directory: frontend/mobile/hdx_mobile/ios
        run: pod install

      - name: Select simulator
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS-(1[7-9]|[2-9][0-9])")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          test -n "$UDID" && [ "$UDID" != "null" ]
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run RunnerTests
        working-directory: frontend/mobile/hdx_mobile
        run: |
          xcodebuild test -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO
          echo "TEST SUCCEEDED (xcodebuild exit 0)"
