org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Required by flutter_stripe 11.5.0 (README item 8, flutter_stripe issue #1909): R8 full mode
# crashes the Stripe SDK in release builds. AGP 8 defaults to full mode, so disable it.
android.enableR8.fullMode=false
