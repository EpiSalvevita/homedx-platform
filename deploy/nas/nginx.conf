server {
    listen 80;
    server_name _;

    # Optional TLS: mount certs at /etc/nginx/certs/ and set WEB_TLS_PORT in compose.
    # Uncomment the redirect + ssl server block in nginx-tls.conf.example.

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Same-origin API so the web app works on any hostname (IP, fritz.box, homedx.de).
    location /gg-homedx-json/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Content-Disposition "attachment";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
