server {
    listen 80;
    server_name _;

    # Optional TLS: mount certs at /etc/nginx/certs/ and set WEB_TLS_PORT in compose.
    # Uncomment the redirect + ssl server block in nginx-tls.conf.example.

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Content-Disposition "attachment";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
