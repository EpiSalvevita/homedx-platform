services:
  postgres:
    image: postgres:16-alpine
    container_name: homedx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homedx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-homedx}
    volumes:
      - homedx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homedx} -d ${POSTGRES_DB:-homedx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: homedx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homedx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homedx}?schema=public
      PORT: "4000"
      HOMEDX_SEED_DOCTORS: ${HOMEDX_SEED_DOCTORS:-false}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  nginx:
    image: nginx:alpine
    container_name: homedx-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./downloads:/usr/share/nginx/downloads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  homedx_pgdata:
